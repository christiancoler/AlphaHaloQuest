name: Build AlphaHaloQuest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G
  # A fixed high value keeps sideloaded updates compatible without exposing an
  # internal revision counter in the APK metadata.
  HALO_BUILD_NUMBER: 1000000

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install build tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools"
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP/tools" --strip-components=1 ccache-4.10.2-linux-x86_64/ccache
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      - uses: actions/cache@v4
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Configure release signing
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/alpha-halo-quest.keystore"
            echo "HALO_ANDROID_KEYSTORE=$RUNNER_TEMP/alpha-halo-quest.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore is configured; this build will not update over APKs signed elsewhere."
          fi

      - name: Build APK
        env:
          HALO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HALO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tools/ci_build.py android release

      - name: Test OpenXR integration
        run: python3 tools/test_quest_xr.py

      - uses: actions/upload-artifact@v4
        with:
          name: AlphaHaloQuest
          path: dist/AlphaHaloQuest
          retention-days: 14

  release:
    needs: android
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AlphaHaloQuest
          path: release

      - name: Package APK
        run: (cd release && zip -qr ../AlphaHaloQuest.zip .)

      - name: Publish alpha release
        env:
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          printf 'Experimental standalone Quest build. It is janky, buggy, and incomplete, but fun.\n\nCommit: %s\n' \
            "$COMMIT_URL" > release-notes.md
          gh release delete alpha --cleanup-tag --yes 2>/dev/null || true
          gh release create alpha release/AlphaHaloQuest.apk AlphaHaloQuest.zip \
            --target "$GITHUB_SHA" \
            --title "Experimental alpha" --notes-file release-notes.md --latest
